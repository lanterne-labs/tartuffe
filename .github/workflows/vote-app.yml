# The vote app (isoloir, through @isoloir/web) as static files on
# https://lanterne-labs.github.io: built from the frontend with the vote's
# settings (the repository variables VOTE_*), the candidates' cards fetched
# from the API at build time, pushed to the public repository
# lanterne-labs/lanterne-labs.github.io with a deploy key (the secret
# VOTE_APP_DEPLOY_KEY: the private key whose public half is a write deploy
# key of that repository).
name: vote-app
on:
  push:
    branches: [main]
    paths: ['frontend/**', '.github/workflows/vote-app.yml']
  workflow_dispatch:
jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: SRS
        working-directory: frontend
        run: ./scripts/srs.sh
      - name: Settings
        env:
          VOTE_ORIGIN: ${{ vars.VOTE_ORIGIN }}
          VOTE_LOG_KEY: ${{ vars.VOTE_LOG_KEY }}
          VOTE_POLLS: ${{ vars.VOTE_POLLS }}
        run: |
          set -eu
          for v in VOTE_ORIGIN VOTE_LOG_KEY VOTE_POLLS; do
            eval "x=\${$v:-}"
            [ -n "$x" ] || { echo "the repository variable $v is not set"; exit 1; }
          done
      # The candidates (GET /api/polls/<slug> for each event of VOTE_POLLS)
      # are fetched by the build itself (scripts/vote-app.mjs), from VITE_API_BASE.
      - name: Build, with the candidates
        working-directory: frontend
        env:
          VITE_API_BASE: ${{ vars.VOTE_API_BASE || 'https://tartuffe.me' }}
          VITE_VOTE_ORIGIN: ${{ vars.VOTE_ORIGIN }}
          VITE_VOTE_LOG_KEY: ${{ vars.VOTE_LOG_KEY }}
          VITE_VOTE_REGISTRY: ${{ vars.VOTE_REGISTRY || '1' }}
          VITE_VOTE_POLLS: ${{ vars.VOTE_POLLS }}
          VITE_VOTE_MIRROR: ${{ vars.VOTE_MIRROR || 'https://lanterne-labs.github.io/vote-data' }}
          VITE_VOTE_MIRROR_REPO: ${{ vars.VOTE_MIRROR_REPO || 'lanterne-labs/vote-data' }}
        run: npm run build:vote
      - name: Publish
        env:
          DEPLOY_KEY: ${{ secrets.VOTE_APP_DEPLOY_KEY }}
        run: |
          set -eu
          [ -n "$DEPLOY_KEY" ] || { echo "no VOTE_APP_DEPLOY_KEY secret: build kept, nothing published"; exit 0; }
          mkdir -p ~/.ssh && printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/deploy -o IdentitiesOnly=yes"
          git clone -q --depth 1 git@github.com:lanterne-labs/lanterne-labs.github.io.git pages
          find pages -mindepth 1 -maxdepth 1 ! -name .git ! -name README.md -exec rm -rf {} +
          cp -R frontend/build-vote/. pages/
          touch pages/.nojekyll
          cd pages
          git add -A
          git -c user.name=tartuffe-vote -c user.email=vote@tartuffe.me commit -q -m "build ${GITHUB_SHA::12}" || { echo "nothing changed"; exit 0; }
          git push -q origin HEAD:main
