name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: write       # push the implementation branch
      pull-requests: write  # open the PR automatically
      issues: write         # comment back with the PR link
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      - name: Mint GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.CLAUDE_BOT_APP_ID }}
          private-key: ${{ secrets.CLAUDE_BOT_APP_PRIVATE_KEY }}
          owner: lanterne-labs

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ steps.app-token.outputs.token }}

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ steps.app-token.outputs.token }}
          allowed_bots: '*'

          # This is an optional setting that allows Claude to read CI results on PRs
          additional_permissions: |
            actions: read

          # When invoked from an issue, finish by opening a real PR (not just
          # the pre-filled compare-link comment that the action posts by default).
          claude_args: >-
            --allowed-tools "Bash(gh pr create:*),Bash(gh pr view:*),Bash(gh pr edit:*),Bash(git push:*)"
            --append-system-prompt "When triggered from a GitHub issue, after pushing your implementation branch you MUST open the pull request yourself by running: gh pr create --base main --head <branch> --title <title> --body <body>. The body must include 'Closes #<issue-number>' so the PR links back to the issue. Do NOT stop at posting a 'Create PR' link — actually create the PR."
