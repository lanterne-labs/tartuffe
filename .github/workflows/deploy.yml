# Deploys main to the host on every push. The host cannot read the
# lanterne-labs repositories itself, so the code is uploaded with a token of
# the project's production environment. What the upload runs is the secret
# DEPLOY_SCRIPT (it installs the host's CLI, uploads the service, then
# follows the deployment until it ends: SUCCESS or SKIPPED passes); the
# secret DEPLOY_TOKEN_NAME names the secret that holds the token.
name: deploy

on:
  push:
    branches: [main]
    # a change to the documentation alone deploys nothing
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    # A build takes about 2 minutes; the backstop of the script's wait.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # frontend's root directory (frontend/) is a service setting:
        # every service is uploaded from the repository root.
        service: [mirror, worker, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: deploy ${{ matrix.service }}
        env:
          DEPLOY_SCRIPT: ${{ secrets.DEPLOY_SCRIPT }}
          DEPLOY_TOKEN: ${{ secrets[secrets.DEPLOY_TOKEN_NAME] }}
          SERVICE: ${{ matrix.service }}
        run: bash -c "$DEPLOY_SCRIPT"
