# Deploys main to the host on every push. What is specific to the host (its
# tools, how a deployment is followed) is in the secret DEPLOY_SCRIPT, run with
# SERVICE and DEPLOY_TOKEN set; its output stays out of the public log.
name: deploy

on:
  push:
    branches: [main]
    # a change to the documentation alone deploys nothing
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    # A build takes about 2 minutes; the backstop of the wait in the script.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # frontend's root directory (frontend/) is a service setting:
        # every service is uploaded from the repository root.
        service: [mirror, worker, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: deploy ${{ matrix.service }}
        env:
          SERVICE: ${{ matrix.service }}
          DEPLOY_TOKEN: ${{ secrets[secrets.DEPLOY_TOKEN_NAME] }}
          DEPLOY_SCRIPT: ${{ secrets.DEPLOY_SCRIPT }}
        run: |
          printf '%s\n' "$DEPLOY_SCRIPT" > "$RUNNER_TEMP/deploy.sh"
          status=0
          sh "$RUNNER_TEMP/deploy.sh" > "$RUNNER_TEMP/deploy.log" 2>&1 || status=$?
          echo "deploy of $SERVICE: exit $status"
          exit "$status"
