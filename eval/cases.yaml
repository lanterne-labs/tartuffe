  # ─── Person 5 ──────────────────────────────────────────────────────────
  # Claire Petit — designed specifically to test the STANCE MERGE SWEEP.
  #
  # Eight facts split across two themes that the stance manager is expected
  # to fragment into TWO separate stances at ingest time:
  #   - "Protection des services publics" (left-leaning framing: hospitals,
  #     teachers, sécurité sociale, république)
  #   - "Discipline budgétaire de l'État" (right-leaning framing: rigueur,
  #     austérité, dette, viabilité)
  # The two stances share the same underlying axis (public spending vs
  # austerity) but use almost zero lexical overlap. The expectation:
  #   1. At ingest, embeddings drift them into 2 stances.
  #   2. The stance merge sweep's Phase-A centroid similarity flags them as
  #      merge candidates; Phase-B LLM vet should agree they're the same
  #      value axis and merge them.
  #   3. Post-merge re-analysis catches the cross-stance contradictions
  #      that the default KNN-filtered detector would have missed entirely
  #      because intra-pair embeddings are too far apart.
  #
  # All four expected_pairs are CROSS-STANCE — none would be caught by
  # daily-pipeline detection without the merge sweep firing.
  - name: "Claire Petit"
    entity_type: "human"
    stances:

      # Theme A — protection of public services. Designed to land in a
      # "défense des services publics" stance via embedding routing.
      - axis: "protection des services publics"
        facts:
          - id: "cp-prot-1"
            text: "Claire Petit a promis de défendre l'accès inconditionnel aux hôpitaux publics français."
            text_en: "Claire Petit promised to defend unconditional access to French public hospitals."
            verb: "PROMISED"
            embedding_text: "défense hôpitaux publics accès inconditionnel"
            quote: "Je m'engage à défendre l'accès inconditionnel aux hôpitaux publics."
            date: "2023-09-14"
            source_url: "https://test.example.com/cp/prot/1"

          - id: "cp-prot-2"
            text: "Claire Petit a promis une augmentation de 10% du salaire des enseignants sur cinq ans."
            text_en: "Claire Petit promised a 10% increase in teacher salaries over five years."
            verb: "PROMISED"
            embedding_text: "promesse augmentation salaire enseignants 10 pourcent"
            quote: "Je m'engage à augmenter de 10% le salaire des enseignants sur cinq ans."
            date: "2023-11-04"
            source_url: "https://test.example.com/cp/prot/2"

          - id: "cp-prot-3"
            text: "Claire Petit a affirmé que les services publics hospitaliers sont un engagement républicain sacré."
            text_en: "Claire Petit stated that public hospital services are a sacred republican commitment."
            verb: "CLAIMED"
            embedding_text: "services publics hospitaliers engagement républicain sacré"
            quote: "Les services publics hospitaliers sont un engagement républicain sacré."
            date: "2024-02-18"
            source_url: "https://test.example.com/cp/prot/3"

          - id: "cp-prot-4"
            text: "Claire Petit a voté pour le maintien des dotations de fonctionnement des hôpitaux publics en 2024."
            text_en: "Claire Petit voted to maintain hospital operating subsidies in 2024."
            verb: "VOTED_FOR"
            embedding_text: "vote maintien dotations hôpitaux 2024"
            quote: "Vote enregistré: pour le maintien des dotations hospitalières."
            date: "2024-06-20"
            source_url: "https://test.example.com/cp/prot/4"

      # Theme B — fiscal discipline / austerity. Designed to land in a
      # SEPARATE "rigueur budgétaire" stance because of vocabulary drift
      # (rigueur, discipline, dette, viabilité financière) even though the
