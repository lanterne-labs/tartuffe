# Digital Mirror — End-to-end contradiction detection eval corpus
#
# Three fictional politicians, three stances each, four facts per stance.
# 3 × 3 × 4 = 36 facts. Plus an explicit list of pair expectations.
#
# All persons are FICTIONAL. Names, dates, factories, votes, court rulings
# are invented. Do not reuse against real-person data — keep this corpus
# isolated from production. Re-running this eval RESETS the test persons.
#
# Conventions:
#   - id format: {person_prefix}-{stance_prefix}-{n}
#   - source_url uses https://test.example.com/ to make it impossible to
#     collide with a real production source.
#   - lang is "fr" for all facts unless otherwise noted.
#   - Any pair NOT listed in expected_pairs is implicitly expected to be
#     NOT contradictory. If the detector flags such a pair, it's counted
#     as a false positive.

persons:
