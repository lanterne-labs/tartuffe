# Expected pair verdicts.
# Pairs not listed are implicitly expected NO (any positive flag on them is a false positive).
expected_pairs:

  # ── Sophie Martin: industrial sovereignty (values-based contradictions) ──
  - a: "sm-indus-1"
    b: "sm-indus-4"
    expected: YES
    rule: "values_based"
    notes: "Promise to rebuild French artisanat vs own action authorising offshoring of a French factory to China. Opposite directions on the same axis of French industrial sovereignty."

  - a: "sm-indus-2"
    b: "sm-indus-4"
    expected: YES
    rule: "values_based"
    notes: "Voted for tariffs protecting French industry vs authorised offshoring. Both on the industrial-sovereignty axis."

  - a: "sm-indus-3"
    b: "sm-indus-4"
    expected: YES
    rule: "values_based"
    notes: "Speech defending French industrial jobs vs authorising a 5,000-employee offshoring. Opposite directions on the same axis."

  # ── Sophie Martin: pension (direct promise vs vote) ──
  - a: "sm-retr-1"
    b: "sm-retr-2"
    expected: YES
    rule: "denial_after_claim"
    notes: "Promised to lower retirement age to 60, then voted to raise it to 64."

  - a: "sm-retr-3"
    b: "sm-retr-2"
    expected: YES
    rule: "values_based"
    notes: "Claimed to defend working-class retirements vs vote raising retirement age. Same axis, opposite direction."

  # ── Sophie Martin: education (direct promise vs vote, plus third-party date noise) ──
  - a: "sm-edu-1"
    b: "sm-edu-2"
    expected: YES
    rule: "denial_after_claim"
    notes: "Promised 20% salary increase vs voted against the salary-increase bill."

  - a: "sm-edu-3"
    b: "sm-edu-4"
    expected: NO
    rule: "third_party_narrative"
    notes: "Both statements are third-party news reports of the same signing event with different dates (10 vs 11 May). Neither is Sophie Martin's own utterance. HARD GATE + DATE-ONLY CONFLICT both apply."

  # ── Marc Dubois: ecology (values vs opposing actions/votes) ──
  - a: "md-eco-1"
    b: "md-eco-2"
    expected: YES
    rule: "values_based"
    notes: "Carbon-neutrality promise vs own action authorising a major coal mine. Opposite directions on the ecological-transition axis."

  - a: "md-eco-3"
    b: "md-eco-4"
    expected: YES
    rule: "values_based"
    notes: "Claim of supporting renewables vs vote against the EU 2035 EV directive. Same axis, opposite direction."

  # ── Marc Dubois: foreign policy (compatible diplomacy + direct contradiction) ──
  - a: "md-fp-1"
    b: "md-fp-2"
    expected: NO
    rule: "consistent_position"
    notes: "Calling Russia a threat AND meeting the Russian FM for dialogue are compatible — declaring a threat doesn't preclude maintaining diplomatic channels. Different acts on the same stance, not contradictory."

  - a: "md-fp-3"
    b: "md-fp-4"
    expected: YES
    rule: "denial_after_claim"
    notes: "Promised to increase defence budget by 30%, then voted against the LPM that would have done so."

  # ── Marc Dubois: health (direct promise vs action + third-party date noise) ──
  - a: "md-sante-1"
    b: "md-sante-2"
    expected: YES
    rule: "values_based"
    notes: "Promised to keep all public hospitals open vs own action authorising closure of 50. Opposite direction, materially undermines the commitment."

  - a: "md-sante-3"
    b: "md-sante-4"
    expected: NO
    rule: "third_party_narrative"
    notes: "Two news reports of the same press conference with different dates. Neither is Marc Dubois's own utterance."

  # ── Anna Rousseau: civil liberties (values vs opposing votes) ──
  - a: "ar-civ-1"
    b: "ar-civ-2"
    expected: YES
    rule: "values_based"
    notes: "Promise to oppose mass surveillance extension vs vote for expanded algorithmic surveillance. Opposite directions on the same axis."

  - a: "ar-civ-3"
    b: "ar-civ-4"
    expected: YES
    rule: "values_based"
    notes: "Claim of defending end-to-end encryption vs co-signing a bill mandating backdoors. Opposite directions on the privacy/security axis."

  # ── Anna Rousseau: LGBT rights (fulfilled commitment + learning over time) ──
