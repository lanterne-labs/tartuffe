global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'mirror'
    static_configs:
      - targets: ['mirror.host.internal:9090']
    metrics_path: /metrics
    scheme: http

  # The worker (`dm worker run`) runs the collection tasks and the maintenance
  # pass. Its counters restart with each deploy, so the dashboards read them
  # with rate() or increase().
  - job_name: 'worker'
    static_configs:
      - targets: ['worker.host.internal:9090']
    metrics_path: /metrics
    scheme: http

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
