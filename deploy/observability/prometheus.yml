global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'mirror'
    static_configs:
      - targets: ['mirror.host.internal:9090']
    metrics_path: /metrics
    scheme: http

  # The daily pipeline (cron, `dm pipeline daily`) serves /metrics while a run
  # lasts. Between two runs the target is down (up == 0); the counters of a
  # run restart at 0, so the dashboards read them with rate() or increase().
  - job_name: 'daily-pipeline'
    static_configs:
      - targets: ['daily-pipeline.host.internal:9090']
    metrics_path: /metrics
    scheme: http

  # The worker (`dm worker run`) serves /metrics while it runs.
  - job_name: 'worker'
    static_configs:
      - targets: ['worker.host.internal:9090']
    metrics_path: /metrics
    scheme: http

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
