# ${...}: the private addresses of the services, variables of the observability
# service, filled in by s6-rc.d/prometheus/run.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'mirror'
    static_configs:
      - targets: ['${MIRROR_METRICS_TARGET}']
    metrics_path: /metrics
    scheme: http

  # The worker (`dm worker run`) runs the collection tasks and the maintenance
  # pass. Its counters restart with each deploy, so the dashboards read them
  # with rate() or increase().
  - job_name: 'worker'
    static_configs:
      - targets: ['${WORKER_METRICS_TARGET}']
    metrics_path: /metrics
    scheme: http

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
