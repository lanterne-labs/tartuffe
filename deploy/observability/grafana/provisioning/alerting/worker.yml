apiVersion: 1

# No alert rule is left here: the worker's daily digest (backend/digest) says
# what needs someone. A new alert goes to the Telegram chat of the worker: the
# contact point "telegram" is written at the start of Grafana
# (s6-rc.d/grafana/run) from TELEGRAM_BOT_TOKEN and TELEGRAM_CHAT_ID of the
# observability service (e.g. ${{worker.TELEGRAM_BOT_TOKEN}}); without them
# Grafana fails to provision.

policies:
  - orgId: 1
    receiver: telegram
    group_by: ['alertname']
    group_wait: 1m
    group_interval: 30m
    repeat_interval: 12h

# The alerts "No maintenance pass ended for 12 h" (fired most days: a pass
# waits up to MAINTENANCE_EVERY_HOURS, 24 on the worker) and "Feed of the day
# missing after 06:00 UTC" (repeated every 12 h in the chat) told nothing the
# digest does not: it names a stuck pass and a missing feed once a day.
deleteRules:
  - orgId: 1
    uid: worker-maintenance-stale
  - orgId: 1
    uid: worker-feed-missing
