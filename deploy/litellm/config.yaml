model_list:
  # Chat: primary route via Cloudflare Tunnel to home box.
  - model_name: chat
    litellm_params:
      model: os.environ/OPEN_AI_CHAT_MODEL
      custom_llm_provider: openai
      api_base: os.environ/OPEN_AI_API
      api_key: os.environ/OPEN_AI_KEY
      extra_headers:
        CF-Access-Client-Id: os.environ/CF_ACCESS_CLIENT_ID
        CF-Access-Client-Secret: os.environ/CF_ACCESS_CLIENT_SECRET
  # Chat fallback: OpenRouter (different model intentionally).
  # Distinct model_name so it is NOT load-balanced with primary; only invoked
  # via the explicit fallbacks map below when primary fails.
  - model_name: chat-fallback
    litellm_params:
      model: os.environ/FALLBACK_CHAT_MODEL
      custom_llm_provider: openai
      api_base: os.environ/FALLBACK_URL
      api_key: os.environ/FALLBACK_KEY

  # Embedding: primary route via Cloudflare Tunnel to home box.
  - model_name: embedding
    litellm_params:
      model: os.environ/OPEN_AI_EMBED_MODEL
      custom_llm_provider: openai
      api_base: os.environ/OPEN_AI_API
      api_key: os.environ/OPEN_AI_KEY
      extra_headers:
        CF-Access-Client-Id: os.environ/CF_ACCESS_CLIENT_ID
        CF-Access-Client-Secret: os.environ/CF_ACCESS_CLIENT_SECRET
  # Embedding fallback: OpenRouter. Same OPEN_AI_EMBED_MODEL by design so the
  # vector space is identical on primary and fallback (drift-impossible by
  # construction).
  - model_name: embedding-fallback
    litellm_params:
      model: os.environ/OPEN_AI_EMBED_MODEL
      custom_llm_provider: openai
      api_base: os.environ/FALLBACK_URL
      api_key: os.environ/FALLBACK_KEY
      # OpenRouter's Zod schema rejects encoding_format unless it is exactly
      # "float" or "base64"; LiteLLM sometimes forwards it as None which fails
      # validation. Strip it on the fallback path.
      additional_drop_params: ["encoding_format"]

router_settings:
  fallbacks:
    - chat: ["chat-fallback"]
    - embedding: ["embedding-fallback"]
  retry_policy:
    BadRequestErrorRetries: 0
    AuthenticationErrorRetries: 0
    TimeoutErrorRetries: 1
    InternalServerErrorRetries: 1
    ContentPolicyViolationErrorRetries: 0
  cooldown_time: 30

litellm_settings:
  drop_params: true
  # Long enough to absorb llama-swap cold-loads (the primary provider
  # loads/unloads models on demand; a fresh load of a 26B chat model
  # can easily take 30-60s, embedding less but still tens of seconds).
  request_timeout: 600
