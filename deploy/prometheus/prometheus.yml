global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: 'digital-mirror'
    # Use the host internal DNS - replace with your service name
    # the host services can communicate via internal DNS: http://<service-name>.host.internal:<port>
    static_configs:
      - targets: ['digital-mirror-backend.host.internal:8080']
    metrics_path: /metrics
    scheme: http

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
