    expect: keep
    bucket: position_reversal
    notes: "Announced X ('I will run') then announced NOT-X ('I will not run') for the SAME election — a reversal. The auditor wrongly filed it under announcement_then_action (which is announce-then-DO-consistently). Audit-only since 2026-10-28: fact B (3959) has no date and the name 'Patrice Martin' covers several people in the DB (a painter, a CNOSF candidate), so the verifier's doubt that A and B are one election and one person is fair."
    judges: [audit]

