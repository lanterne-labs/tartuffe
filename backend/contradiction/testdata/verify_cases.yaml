    expect: keep
    bucket: self_exempting_double_standard
    notes: "Own normative rule for the convicted class + she now falls in that class (convicted) + self-exemption on the SAME sanction (ineligibility). Not [vague_vs_specific]: the rule binds her once she enters the class."

  # The self-exemption rule OVER-FIRED in prod (mirror-01y): the MLP rebuild paired the 2013
  # rule with 10 legal-process facts that are not her self-exempting act at all. The rule's
  # partner must be her OWN claim/act of eligibility; the conviction is only the trigger.
  # Being convicted AGREES with "the convicted should be barred" — it does not contradict it.
  # NOTE: the rule-vs-CONVICTION shape ("elle a été condamnée à ... d'inéligibilité" vs the 2013
  # rule) was trialled here with expect:drop and NOT asserted — same limit as the Attal #169 case
  # above. Anchored by a claimed_reason that asserts the link, the verifier keeps it 0/4 even
  # though its own REASONING correctly says she "was subject to that very sanction" (i.e. agrees
  # with her rule). The real fix is one layer up, at the ANALYZE step, which is what actually
  # created these edges: promptrules.ContradictionRules now carries a MECHANICAL CHECK (never emit
  # a self-exemption edge against a WAS_CONVICTED key fact or a court/parquet/verdict fact — those
  # are the trigger, not the breaker). Measured on the real prod shapes: conviction 0/4, parquet
  # 0/4, awaiting-verdict 0/4, her own eligibility claim 4/4. So the verifier never sees the pair.
  - name: "FP_selfexempt_vs_prosecutor_request"
    fact_a: "Le parquet a requis quatre ans de prison, dont un an ferme, et cinq ans d'inéligibilité contre Marine Le Pen dans le procès des assistants FN."
    fact_b: "Marine Le Pen a déclaré en 2013 qu'il faudrait rendre inéligibles à vie ceux qui étaient condamnés."
    claimed_reason: "Elle voulait l'inéligibilité à vie des condamnés mais fait face à une réquisition d'inéligibilité."
    expect: drop
    bucket: self_exempting_double_standard
    notes: "A prosecutor's request is a third party's act, not hers — fails the utterance gate outright. Was wrongly recorded in prod as contradiction #371."

  # NOTE: the BARE-announcement variant of the same shape ("Marine Le Pen a annoncé sa
  # candidature pour le Rassemblement national" vs the 2013 rule) was trialled and
  # deliberately NOT asserted. On its own the pair carries no conviction context — the
  # class-membership lives only in the claimed_reason — so the auditor files it under
  # different_subjects 3/3. Forcing it to keep would mean teaching the judges that any
  # candidacy announcement + any old normative statement is a contradiction, which is
  # over-broad. It is also not the edge the pipeline forms: the stance analyzer rates the
  # bare re-announcement DUPLICATE/NEW_INFO, and the real hypocrisy edge it creates is the
  # 10540 <-> 10846 pair asserted above. Same caution as the Ciotti #157 / Bardella #168 skips.

  # ---- Bucket: amendment-vote semantics (2026-09-05, from prod scrutins 17-4373/17-4375) ----
  # A vote on an amendment judges the MODIFICATION, not the bill. Never invert it.

  - name: "FP_vote_dilatory_subamendment_arcelor"
    fact_a: "Mathilde Panot a affirmé qu'elle se battrait pour la nationalisation d'ArcelorMittal."
    fact_b: "Mathilde Panot a voté CONTRE le sous-amendement UDR n° 372 visant à porter de six mois à un an le délai d'audit de la Cour des comptes préalable à la nationalisation d'ArcelorMittal."
    claimed_reason: "Elle promet de se battre pour la nationalisation mais a voté contre un texte s'inscrivant dans le projet de nationalisation."
    expect: drop
    bucket: relative_vote_preference
    notes: "Prod scrutin 17-4373: rejecting a rival group's dilatory sub-amendment (longer audit = delayed nationalisation) IS fighting for the bill."

  - name: "FP_vote_contre_modif_and_contre_baseline"
    fact_a: "Mathilde Panot a voté CONTRE le sous-amendement portant de six mois à un an le délai d'audit préalable à la nationalisation."
    fact_b: "Mathilde Panot a voté CONTRE l'amendement instaurant un audit de six mois de la Cour des comptes préalable à la nationalisation."
    claimed_reason: "Elle refuse l'allongement du délai d'audit mais refuse aussi le délai court, positions incompatibles sur le délai."
    expect: drop
    bucket: relative_vote_preference
    notes: "Prod scrutins 17-4373 + 17-4375, minutes apart: both votes express ONE position — no dilatory audit device at all. CONTRE(modification) does not mean POUR(baseline)."

  - name: "FP_vote_hostile_amendment_climat"
    fact_a: "Marine Tondelier a promis de défendre la loi de programmation climatique jusqu'à son adoption."
    fact_b: "Marine Tondelier a voté CONTRE le sous-amendement n° 89 de la Droite Républicaine visant à reporter d'un an l'entrée en vigueur de la loi de programmation climatique."
    claimed_reason: "Elle défend la loi climatique mais vote contre un texte relatif à cette loi."
    expect: drop
    bucket: relative_vote_preference
    notes: "Different domain than the Arcelor cases so the rule generalizes: hostile-camp postponement amendment, voting it down = defending the bill."

  - name: "TP_vote_ensemble_contre_after_support"
    fact_a: "Olivier Faure a déclaré soutenir pleinement la proposition de loi sur l'encadrement des loyers et appeler à son adoption."
    fact_b: "Olivier Faure a voté CONTRE l'ensemble de la proposition de loi sur l'encadrement des loyers."
    claimed_reason: "Il appelle à l'adoption du texte puis vote contre l'ensemble de ce même texte."
    expect: keep
    bucket: vote_where_your_mouth_is
    notes: "A vote on l'ensemble IS the position — relative_vote_preference must NOT excuse text-level votes. Tactical or not, you vote where your mouth is."

  - name: "TP_vote_amendment_hits_own_principle"
    fact_a: "Laurent Wauquiez a déclaré qu'aucune nationalisation ne devrait être engagée sans un audit préalable de la Cour des comptes."
    fact_b: "Laurent Wauquiez a voté CONTRE l'amendement instaurant un audit préalable de la Cour des comptes avant la nationalisation d'ArcelorMittal."
    claimed_reason: "Il exige un audit préalable à toute nationalisation mais vote contre l'amendement qui instaure précisément cet audit."
    expect: keep
    bucket: vote_where_your_mouth_is
    notes: "The carve-out inside relative_vote_preference: the amendment's CONTENT is exactly what he committed to, so the vote breaks HIS OWN stated principle."

  - name: "TP_abstention_after_promised_vote"
    fact_a: "Sébastien Lecornu a annoncé qu'il voterait pour l'ensemble du projet de loi de programmation militaire."
    fact_b: "Sébastien Lecornu s'est abstenu lors du vote sur l'ensemble du projet de loi de programmation militaire."
    claimed_reason: "Il promet de voter pour puis s'abstient lors du scrutin."
    expect: keep
    bucket: vote_where_your_mouth_is
    notes: "Promised ballot behavior is a commitment; abstaining breaks it. Edge: abstention is not a CONTRE but still breaks 'je voterai pour'."

  # Groups of restatements (promptrules.Statement.Also). Headline texts are the
  # prod meta-fact wordings; the restatements are its real members.
  - name: "TP_detail_only_in_a_restatement"
    fact_a: "François Bayrou a proposé un plan pour ramener le déficit sous un certain niveau afin de sortir du surendettement."
    also_a:
      - "François Bayrou a proposé un effort de 43,8 milliards d'euros, incluant la suppression de deux jours fériés, pour ramener le déficit sous les 5 % du PIB."
      - "François Bayrou a prôné la définition d'un plan de cinq ans pour ramener les déficits en dessous du niveau moyen de la croissance afin de sortir du surendettement."
    fact_b: "François Bayrou a affirmé qu'il ne supprimerait aucun jour férié."
    claimed_reason: "Il propose de supprimer deux jours fériés puis affirme qu'il n'en supprimera aucun."
    expect: keep
    bucket: restatements
    notes: "The decisive detail (two public holidays) is only in a restatement, not in the headline. A gate that ignores the other wordings drops a real reversal."

  - name: "FP_restatements_disagree_among_themselves"
    fact_a: "Raphaël Glucksmann a proposé de revaloriser le chèque énergie pour les classes populaires et moyennes."
    also_a:
      - "Raphaël Glucksmann a proposé de tripler le chèque énergie à 200 euros pour les classes populaires et moyennes."
      - "Raphaël Glucksmann propose que le montant du chèque énergie soit porté de 150 euros à 500 euros par an."
    fact_b: "Raphaël Glucksmann a proposé de financer les aides à l'énergie par la taxation des superprofits des multinationales pétrolières."
    claimed_reason: "Le montant du chèque énergie proposé varie entre 200 et 500 euros."
    expect: drop
    bucket: restatements
    notes: "The only 'conflict' is between two wordings of statement A (reporting variance on the amount); statement B does not contradict A. Wordings of one statement are never compared with each other."

  # ---- Prod false positives kept by BOTH judges (audit of 2026-09-25, mirror-733) ----

  # A targeted premium made tax-free is not a general fuel-tax cut: "de manière générale et
  # indiscriminée" scopes B to the universal measure (DROP).
  - name: "FP_594_lecornu_taxfree_premium_vs_no_general_fuel_tax_cut"
    fact_a: "Le Gouvernement simplifie et libéralise la prime carburant en la passant de 300 à 600€, en la rendant totalement défiscalisée et sans condition."
    fact_b: "Le gouvernement, via Sébastien Lecornu, n'envisage pas de baisse de la fiscalité sur le carburant de manière générale et indiscriminée."
    claimed_reason: "La décision de doubler la prime et de la rendre totalement défiscalisée contredit la position affirmant que le gouvernement n'envisage pas de baisse de la fiscalité sur le carburant."
    expect: drop
    bucket: procedural_scope
    notes: "The prime carburant is a targeted premium; exempting it from income tax is not a cut of the fuel tax, and B only rules out the general, indiscriminate cut. Same shape as FP_177."

  # Extending TARGETED aid and refusing to reopen GENERALIZED aid are the same line (DROP).
  - name: "FP_679_lecornu_premium_vs_targeted_aid_extension"
    fact_a: "Le Gouvernement simplifie et libéralise la prime carburant en la passant de 300 à 600€, en la rendant totalement défiscalisée et sans condition."
    fact_b: "Sébastien Lecornu a annoncé la prolongation des aides aux filières les plus exposées jusqu'au 31 décembre."
    also_b:
      - "Sébastien Lecornu ne veut pas rouvrir les vannes à des aides généralisées pour les carburants."
      - "Sébastien Lecornu a demandé de prolonger jusqu'au 31 décembre les aides ciblées sur les carburants."
    claimed_reason: "L'action de doubler et de défiscaliser la prime (A) est une expansion massive des aides qui contredit directement la position de Lecornu refusant de rouvrir les vannes aux aides généralisées (B)."
    expect: drop
    bucket: procedural_scope
    notes: "The premium is a targeted measure (a bonus paid to workers), not a generalized fuel aid; B keeps aid targeted and refuses to generalize it. No reversal."

  # "Premier responsable ... et non un manque de moyens" names the PRIMARY culprit and rules
  # out one cause (resources); admitting errors and negligence in the chain is a different
  # cause, compatible with both (DROP). Same shape as FP_156 / FP_166.
  - name: "FP_262_lecornu_primary_culprit_vs_protection_failures"
    fact_a: "Sébastien Lecornu a affirmé que le premier responsable du drame de l'affaire Lyhanna est le meurtrier et non un manque de moyens de l'institution judiciaire."
    fact_b: "Sébastien Lecornu a déclaré que la chaîne de protection a failli dans l'affaire Lyhanna, en raison d'une succession d'erreurs, de négligences, d'inactions et de mauvaises décisions."
    claimed_reason: "Lecornu a d'abord affirmé que la responsabilité incombait au meurtrier et non à un manque de moyens, puis a déclaré que la chaîne de protection avait failli par des erreurs et négligences."
    expect: drop
    bucket: complementary_cause
    notes: "'Premier responsable' is not 'seul responsable', and 'non un manque de moyens' excludes a budget cause only; errors and negligence are neither. Both judges read A as 'no institutional fault at all'."

  # "Dégager un effort supplémentaire sur les dépenses" is budget French for extra SAVINGS:
  # it and a spending freeze point the same way (DROP).
  - name: "FP_691_lecornu_spending_effort_vs_freeze"
    fact_a: "Sébastien Lecornu a décidé de rouvrir les lettres plafonds afin de dégager un effort supplémentaire sur les dépenses de l'État pour le budget 2027."
    also_a:
      - "Sébastien Lecornu a décidé de rouvrir les lettres-plafonds afin de dégager un effort supplémentaire sur les dépenses de l'État."
    fact_b: "Sébastien Lecornu a demandé à ses ministres un effort supplémentaire sur les dépenses en 2027, afin de les maintenir au même niveau qu'en 2026."
    also_b:
      - "Sébastien Lecornu a promis de geler les dépenses de l'Etat, hormis pour plusieurs ministères."
      - "Sébastien Lecornu a déclaré que les dépenses de l'État resteront stables, hors réarmement et intérêts de la dette, afin d'appliquer une discipline plus forte."
    claimed_reason: "L'engagement de maintenir les dépenses au même niveau est contredit par la décision de dégager un effort supplémentaire de dépenses."
    expect: drop
    bucket: same_direction
    notes: "An 'effort sur les dépenses' is a spending CUT (savings), not more spending; reopening the ceilings to find it IS how the freeze is enforced. Both judges read 'effort de dépenses' as spending more."

  # Trump honoring HIS commitments vs Trump's new view of RUSSIA's commitments: different
  # subjects, and Macron praises Trump in both (DROP).
  - name: "FP_472_macron_trump_reliable_vs_trump_view_of_russia"
    fact_a: "Emmanuel Macron a déclaré avoir 'toujours eu confiance' en Donald Trump, affirmant que ce dernier a 'toujours fait ce à quoi il s'est engagé'."
    also_a:
      - "Emmanuel Macron a affirmé avoir toujours eu confiance en Donald Trump, précisant que ce dernier respecte ses engagements."
    fact_b: "Emmanuel Macron a estimé que Donald Trump a changé de position en reconnaissant que la Russie ne tenait pas ses engagements."
    claimed_reason: "Macron affirme que Trump a changé de position sur les engagements de la Russie, ce qui contredit sa déclaration précédente selon laquelle Trump a toujours respecté ses engagements."
    expect: drop
    bucket: different_subjects
    notes: "Whose commitments: Trump's own (A) vs Russia's (B). Trump updating his view of Russia says nothing about Trump breaking his word, and Macron's own position on Trump is unchanged."

  # Appealing to the Cour de cassation continues a claim of innocence; the conviction it
  # mentions is context, not the act. The denial-vs-conviction contradiction is carried by
  # the conviction facts themselves (DROP). Prod contradiction 294.
  - name: "FP_294_lepen_innocence_vs_cassation_appeal"
    fact_a: "Marine Le Pen a affirmé son innocence sur TF1 suite à sa condamnation à un an de prison avec bracelet électronique et 15 mois d'inéligibilité."
    fact_b: "Marine Le Pen a annoncé son pourvoi en cassation le mardi 7 juillet 2026, suite à sa condamnation en appel pour détournement de fonds publics prévoyant 15 mois d'inéligibilité."
    claimed_reason: "L'affirmation d'innocence de Marine Le Pen est contredite par sa condamnation pour détournement de fonds publics."
    expect: drop
    bucket: coherent_defense
    judges: [verify]
    notes: "Contesting a conviction up to the Cour de cassation is consistent with affirming innocence; the conviction mentioned in B is the context of the appeal, not B's act. Verify-only: the verifier drops it 3/3 (it stops such rows at insertion); the auditor keeps it 3/3 (2026-10-01), so the stored row was dismissed by hand."

