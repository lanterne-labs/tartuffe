# Golden regression set for a *claimed* contradiction, judged by TWO of the
# pipeline's four LLM judges. Each case must either be KEPT (real
# contradiction) or DROPPED (false positive).
#
# JUDGE MAP — who consumes this file, and when each judge runs in prod:
#   1. ANALYZE (stance)  — promptrules.ContradictionRules, at ingest on every
#      new fact; the judge that CREATES contradiction edges. NOT tested here —
#      it has its own golden set: backend/core/testdata/analyze_cases.yaml
#      (TestAnalyzeGolden).
#   2. VERIFIER (refute) — RefuteContradictionPrompt, immediately after (1)
#      and before the DB write: the insertion gate. Tested by TestVerifyGolden
#      over THIS file (expect keep|drop).
#   3. BATCH DETECTOR    — ContradictionRulesAndExamples, daily pipeline step
#      5, KNN sweep over unchecked pairs. Not directly golden-tested (context
#      budget is at the local model's 12k ceiling — see CHANGES.md 2026-07-16).
#   4. AUDITOR           — auditPromptTpl, pipeline step 7 every 5 DAYS over
#      already-stored rows, Apply:true (auto-evict). Tested by TestAuditGolden
#      over THIS file. A prod deletion needs 3 signals: audit remove + a
#      confirming 2nd audit pass + the verifier ALSO refuting (cross-judge
#      veto, applyAuditRemoval). So an auditor keep-failure here usually means
#      "unstable row", not data loss — the verifier veto is the last line.
#
# HOW TO USE
#   - When you see a contradiction in prod that looks wrong (a false positive),
#     add it here with `expect: drop`.
#   - When you see a real contradiction the verifier wrongly killed, add it with
#     `expect: keep`.
#   - Re-run:  source .env; go test -v -run TestVerifyGolden ./backend/contradiction/
#     (skips automatically when OPEN_AI_KEY is unset — local-only, no CI cost.)
#   - Then tune backend/promptrules/verify.go until every case passes.
#
# Fields:
#   name           short unique id (prod contradiction # is handy)
#   fact_a/fact_b  the two fact texts
#   claimed_reason the reason the detector gave when it flagged YES
#   expect         keep | drop
#   bucket         free-form tag for grouping (not enforced)
#   notes          why; for humans

cases:
  # ---- Bucket 1: numeric / measurement mismatches (false positives) ----
  - name: "FP_117_bernalicis_different_rounds"
    fact_a: "Ugo Bernalicis a obtenu 22,49 % à l'élection municipale."
    fact_b: "Ugo Bernalicis a obtenu 17,77 % au premier tour."
    claimed_reason: "He claims two different vote percentages, which is inconsistent."
    expect: drop
    bucket: numeric
    notes: "Two different rounds/measures, not dishonesty."

  - name: "FP_77_afd_forecast_vs_regional_poll"
    fact_a: "L'AfD est projetée comme premier parti aux élections fédérales de 2029."
    fact_b: "L'AfD est actuellement à 41 % en Saxe-Anhalt."
    claimed_reason: "A forecast of being strongest contradicts a 41% poll number."
    expect: drop
    bucket: forecast
    notes: "Forecast vs current regional poll."

  - name: "FP_107_panot_different_metrics"
    fact_a: "Mathilde Panot affirme que Mélenchon a 250 000 soutiens."
    fact_b: "La campagne a réuni 150 000 signatures."
    claimed_reason: "250k supporters contradicts 150k signatures."
    expect: drop
    bucket: numeric
    notes: "Different metrics at different times."

  - name: "FP_84_bsw_same_figure_snapshots"
    fact_a: "Le BSW a obtenu 6,2 % aux élections européennes de 2024."
    fact_b: "Le BSW a obtenu 4,981 % aux élections européennes de 2024."
    claimed_reason: "Two different percentages for the same election is a contradiction."
    expect: drop
    bucket: numeric
    notes: "Different sources/snapshots of the same figure."

  # ---- Bucket 2: different procedural scopes of the same action ----
  - name: "FP_118_lecornu_49-3_scopes"
    fact_a: "Sébastien Lecornu envisage d'utiliser le 49-3 sur la partie recettes du budget."
    fact_b: "Sébastien Lecornu envisage d'utiliser le 49-3 sur la partie dépenses du budget."
    claimed_reason: "Using 49-3 on revenue vs expenditure is inconsistent."
    expect: drop
    bucket: procedural_scope
    notes: "Revenue part vs expenditure part — normal procedure."

  - name: "FP_119_lecornu_49-3_overall"
    fact_a: "Sébastien Lecornu a utilisé le 49-3 sur la partie dépenses du budget."
    fact_b: "Sébastien Lecornu a utilisé le 49-3 pour adopter l'ensemble du budget."
    claimed_reason: "49-3 on expenditure vs to adopt the overall budget is inconsistent."
    expect: drop
    bucket: procedural_scope
    notes: "Different procedural scopes of the same action."

  # ---- Bucket 3: conditional statement whose condition later came true ----
  - name: "FP_104_lepen_condition_met"
    fact_a: "Marine Le Pen a déclaré qu'elle ferait campagne pour Jordan Bardella si elle était déclarée inéligible."
    fact_b: "Marine Le Pen a été condamnée à une peine d'inéligibilité."
    claimed_reason: "She said she would campaign for Bardella but was ruled ineligible."
    expect: drop
    bucket: conditional_met
    notes: "Condition was met, so it's consistent. The model inverted it."

  # ---- Bucket 4: same-direction claims flagged as opposed ----
  - name: "FP_96_macron_same_direction"
    fact_a: "Emmanuel Macron s'est engagé à réinitialiser les relations avec l'Afrique."
    fact_b: "Emmanuel Macron affirme avoir mis fin à la Françafrique."
    claimed_reason: "Resetting relations with Africa contradicts ending la Françafrique."
    expect: drop
    bucket: same_direction
    notes: "Same direction, not contradictory."

  # ---- True positives that MUST be preserved ----
  - name: "TP_99_nunez_warned_then_supported"
    fact_a: "Laurent Nuñez a averti qu'un projet de loi affaiblirait les systèmes de sécurité existants et s'y est opposé."
    fact_b: "Laurent Nuñez a finalement voté en faveur de ce même projet de loi."
    claimed_reason: "He warned against the bill and opposed it, then voted for it."
    expect: keep
    bucket: warned_then_acted
    notes: "Stated opposition/warning then opposing action — a real reversal."

  - name: "TP_121_olive_denial_vs_conviction"
    fact_a: "Karl Olive a affirmé n'avoir commis aucune malversation et n'avoir jamais tiré de profit personnel."
    fact_b: "Karl Olive a été reconnu coupable et condamné pénalement pour prise illégale d'intérêts."
    claimed_reason: "He denied any wrongdoing but was criminally convicted of illegal taking of interest."
    expect: keep
    bucket: denial_vs_finding
    notes: "Personal denial of wrongdoing vs authoritative criminal conviction."

  - name: "TP_112_christophe_motivation_reversal"
    fact_a: "Paul Christophe s'est dit « très motivé » pour prendre ce poste ministériel."
    fact_b: "Paul Christophe a déclaré ne pas être « particulièrement enthousiaste » à l'idée de prendre ce poste."
    claimed_reason: "Very motivated vs not particularly enthusiastic about the same post is a reversal."
    expect: keep
    bucket: position_reversal
    notes: "Attitude reversal in different words about the same thing."

  - name: "TP_114_rn_retirement_promise"
    fact_a: "Le Rassemblement national a promis de maintenir l'âge de départ à la retraite à 62 ans."
    fact_b: "Le Rassemblement national a renoncé à abroger la réforme portant l'âge de la retraite à 64 ans."
    claimed_reason: "Promised to keep retirement at 62 but dropped the repeal of the move to 64."
    expect: keep
    bucket: commitment_walkback
    notes: "Promise to keep 62 vs abandoning repeal of 64 — a broken commitment."

  # ---- Prod-sourced cases from the 2026-05-31 live reverify (gh#23) ----

  # Denounce a named person, then formally ally with them = real reversal (KEEP).
  - name: "TP_103_maximi_denounce_then_ally"
    fact_a: "Marianne Maximi a affirmé que la responsabilité du basculement de Clermont-Ferrand à droite est dans le camp d'Olivier Bianchi."
    fact_b: "Marianne Maximi et Olivier Bianchi ont annoncé la fusion de leurs listes pour le second tour des municipales à Clermont-Ferrand le 16 mars 2026."
    claimed_reason: "L'annonce d'une fusion avec Olivier Bianchi contredit l'affirmation que la responsabilité du basculement de la ville à droite lui incombe."
    expect: keep
    bucket: denounce_then_ally
    notes: "Publicly blamed Bianchi, then merged lists with him — a real public-position reversal toward a named person."

  # Pro-nuclear + anti-renewables is a coherent policy COMBO, not self-contradiction (DROP).
  - name: "FP_106_amblard_coherent_policy_combo"
    fact_a: "Maxime Amblard a affirmé que le projet Cigéo incarne une vision de l'écologie pragmatique."
    fact_b: "Le 28 avril 2025, Maxime Amblard a demandé, au nom du Rassemblement national, un moratoire sur les énergies renouvelables."
    claimed_reason: "La demande d'un moratoire sur les énergies renouvelables contredit la position de soutien à une vision de l'écologie pragmatique."
    expect: drop
    bucket: coherent_policy_combo
    notes: "Pro-nuclear (Cigéo) and anti-renewables is a deliberate, internally-consistent energy stance — not a reversal."

  # Two different concepts ("counter Russian influence" vs colonial "ingérence") only seem opposed (DROP).
  - name: "FP_120_fuchs_different_concepts"
    fact_a: "Bruno Fuchs a conseillé à la France de mettre en place un gros focus avec beaucoup de moyens sur Madagascar pour contrer l'influence russe."
    fact_b: "Bruno Fuchs a déclaré que l'ingérence française est maintenant clairement et définitivement arrêtée."
    claimed_reason: "L'affirmation que l'ingérence française est arrêtée contredit la recommandation de renforcer massivement la présence française à Madagascar."
    expect: drop
    bucket: different_concepts
    notes: "He distinguishes legitimate counter-influence from colonial 'ingérence' — two compatible concepts, not a contradiction."

  # Double negative: "disagreed that climate is NOT covered" == "climate IS covered" == fact B (DROP — same position).
  - name: "FP_92_potier_double_negative_same_position"
    fact_a: "Dominique Potier a exprimé son désaccord avec l'interprétation du ministère public qui considère que le climat ne relève pas des enjeux environnementaux couverts par la loi sur le devoir de vigilance."
    fact_b: "Dominique Potier a affirmé qu'un impact grave sur le climat relève nécessairement du champ d'application du devoir de vigilance."
    claimed_reason: "Dominique Potier affirme désormais que le climat relève du devoir de vigilance, contredisant sa position antérieure de désaccord sur l'inclusion du climat dans ce champ."
    expect: drop
    bucket: same_position_double_negative
    notes: "Disagreeing that climate is NOT covered = believing it IS covered = exactly fact B. Same position; detector tripped on the double negative."

  # ---- Prod-sourced cases from the 2026-06-03 daily run ----

  # Endorsing ANOTHER person for office is fully compatible with not being a candidate yourself (DROP).
  - name: "FP_144_nkm_endorse_vs_self_candidacy"
    fact_a: "Nathalie Kosciusko-Morizet a annoncé, le 2 juin 2026, qu'elle allait soutenir Édouard Philippe pour la présidentielle de 2027."
    fact_b: "Nathalie Kosciusko-Morizet a affirmé qu'elle n'avait aucune ambition personnelle de candidature : «Je ne suis candidate à rien»."
    claimed_reason: "L'affirmation de n'avoir aucune ambition de candidature contredit l'annonce de son soutien à Édouard Philippe pour la présidentielle de 2027."
    expect: drop
    bucket: endorsement_vs_self_candidacy
    notes: "Backing someone else for an office is consistent with declaring you are not a candidate yourself — different roles (endorser vs candidate)."

  # An action that FULFILLS a previously stated goal/trend is follow-through, not a reversal (DROP).
  - name: "FP_147_findlay_action_fulfills_trend"
    fact_a: "Kerry-Lynne Findlay has focused on pushing back on Indigenous rights and ending SOGI."
    fact_b: "Kerry-Lynne Findlay promised that a Conservative government would tear up the province's Declaration of the Rights of Indigenous Peoples Act."
    claimed_reason: "The promise to tear up the Indigenous rights act is the concrete action that fulfills the trend of pushing back on Indigenous rights described in A."
    expect: drop
    bucket: action_fulfills_goal
    notes: "Tearing up the act ADVANCES the stated anti-Indigenous-rights trend — same direction, follow-through. The flagged reason itself says it 'fulfills' A."

  # ---- Prod-sourced cases from the 2026-06-06 daily run ----

  # Two compatible explanations of the SAME problem ("it's bad organization" + "it's
  # NOT a lack of resources") reinforce each other; they are not opposing claims (DROP).
  - name: "FP_156_darmanin_complementary_cause"
    fact_a: "Gérald Darmanin a admis un « dysfonctionnement » et a déclaré que ce dernier est « révélateur de notre mauvaise organisation » concernant le traitement des plaintes dans l'affaire de la disparition de Lyhanna."
    fact_b: "Gérald Darmanin a affirmé que les dysfonctionnements dans l'affaire Lyhanna ne sont pas dus à un manque de moyens."
    claimed_reason: "L'affirmation selon laquelle les dysfonctionnements ne sont pas dus à un manque de moyens contredit la reconnaissance d'un dysfonctionnement lié à la mauvaise organisation du ministère."
    expect: drop
    bucket: complementary_cause
    notes: "'It's bad organization' and 'it's not a lack of resources' are two compatible diagnoses of the same failure (an organizational, not a budgetary, problem) — they agree, not contradict."

  # NOTE: Ciotti #157 ("réinjecter dans le sport local" vs "supprimé les subventions à
