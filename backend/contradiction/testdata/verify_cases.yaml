  # Targeted/partial benefit for specific groups vs declining the TOTAL/universal version — different scope.
  - name: "FP_177_ciotti_partial_vs_total_transport"
    fact_a: "Eric Ciotti a annoncé la gratuité des transports pour les plus de 65 ans, le personnel du CHU et les agents pénitentiaires."
    fact_b: "Eric Ciotti a écarté l'extension de la gratuité totale des transports pour des raisons budgétaires."
    claimed_reason: "Il instaure la gratuité des transports tout en écartant la gratuité des transports."
    expect: drop
    bucket: procedural_scope
    notes: "A targeted measure for specific groups is compatible with declining the TOTAL/universal version; 'totale' marks a different scope, not a reversal."

  # Qualified general stance (oppose calls EN PERMANENCE) vs endorsing ONE specific case.
  - name: "FP_245_lepen_general_vs_specific_resignation"
    fact_a: "Marine Le Pen a affirmé qu'il ne faut pas faire des appels à la démission en permanence et que c'est à la tête de l'État qu'il faut changer les choses."
    fact_b: "Marine Le Pen a estimé que Gérald Darmanin aurait dû démissionner pour des raisons morales dans l'affaire Lyhanna."
    claimed_reason: "Refuser les appels à la démission contredit estimer qu'un ministre aurait dû démissionner."
    expect: drop
    bucket: vague_vs_specific
    notes: "Opposing CONSTANT/systematic resignation calls ('en permanence') is compatible with endorsing ONE specific moral case; the qualifier prevents it from being a blanket position the specific case could break."

