  # The self-exemption rule OVER-FIRED in prod (mirror-01y): the MLP rebuild paired the 2013
  # rule with 10 legal-process facts that are not her self-exempting act at all. The rule's
  # partner must be her OWN claim/act of eligibility; the conviction is only the trigger.
  # Being convicted AGREES with "the convicted should be barred" — it does not contradict it.
  # NOTE: the rule-vs-CONVICTION shape ("elle a été condamnée à ... d'inéligibilité" vs the 2013
  # rule) was trialled here with expect:drop and NOT asserted — same limit as the Attal #169 case
  # above. Anchored by a claimed_reason that asserts the link, the verifier keeps it 0/4 even
  # though its own REASONING correctly says she "was subject to that very sanction" (i.e. agrees
  # with her rule). The real fix is one layer up, at the ANALYZE step, which is what actually
  # created these edges: promptrules.ContradictionRules now carries a MECHANICAL CHECK (never emit
  # a self-exemption edge against a WAS_CONVICTED key fact or a court/parquet/verdict fact — those
  # are the trigger, not the breaker). Measured on the real prod shapes: conviction 0/4, parquet
  # 0/4, awaiting-verdict 0/4, her own eligibility claim 4/4. So the verifier never sees the pair.
  - name: "FP_selfexempt_vs_prosecutor_request"
    fact_a: "Le parquet a requis quatre ans de prison, dont un an ferme, et cinq ans d'inéligibilité contre Marine Le Pen dans le procès des assistants FN."
