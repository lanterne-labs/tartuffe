  # ---- Reversals the AUDITOR over-removed (KEEP). Added after the 2026-06-12 --apply run
  # ---- deleted real flip-flops via the fuzzy buckets (announcement_then_action,
  # ---- third_party_narrative). These guard against eviction of the product's core signal.

  # Announced he IS running, then announced he is NOT running — a textbook reversal, NOT
  # "announcement followed by action" (that bucket is announce-X-then-DO-X). (KEEP)
  - name: "TP_111_martin_announced_run_then_not"
    fact_a: "Patrice Martin, maire sortant du Le Montellier, a annoncé se présenter à sa propre succession à la tête de la liste 'Ensemble pour Le Montellier'."
    fact_b: "Patrice Martin a annoncé qu'il ne se présentera pas aux élections municipales de mars 2026."
    claimed_reason: "L'annonce de se présenter à sa propre succession contredit l'annonce ultérieure de ne pas se présenter aux mêmes élections."
    expect: keep
    bucket: position_reversal
    notes: "Announced X ('I will run') then announced NOT-X ('I will not run') for the SAME election — a reversal. The auditor wrongly filed it under announcement_then_action (which is announce-then-DO-consistently)."

  # Said he would NOT be a candidate, then led a winning list (i.e. WAS a candidate) — a stated
  # position broken by his own contrary action, NOT a benign announcement. (KEEP)
  # PROD FAILURE 2026-07-07: despite this golden passing, the prod auto-evict deleted the real
  # row (cid 173) — the auditor verdict is stochastic on this shape (~0-2 removes / 3 reps,
  # rules drawn: announcement_then_action / different_subjects) and the 5-day audit cycle plus
  # PERMANENT negative pair-check means one bad draw kills it forever (mirror-bii). Restored as
  # cid 488 on 2026-07-26.
  - name: "TP_100_vuibert_not_candidate_then_led_list"
    fact_a: "Lionel Vuibert a annoncé qu'il ne sera pas candidat aux élections municipales de 2026."
    fact_b: "La liste conduite par Lionel Vuibert a obtenu 100% des voix et 11 sièges au conseil municipal de Faissault au premier tour des élections municipales de mars 2026."
    claimed_reason: "Avoir annoncé ne pas être candidat contredit le fait d'avoir conduit (donc d'être tête de liste/candidat sur) une liste aux mêmes élections."
    expect: keep
    bucket: commitment_vs_action
    notes: "Stated non-candidacy then led a list (the tête de liste IS a candidate) at that very election — announcement broken by contrary action. The auditor wrongly filed it under announcement_then_action."

  # Pleads FOR a primary vs says he is NOT in favour of a primary — opposing stances on the same
  # subject. Reported speech ('plaide', 'a exprimé') is still HIS position, not third-party narration. (KEEP)
  - name: "TP_152_retailleau_for_vs_against_primary"
    fact_a: "Bruno Retailleau plaide depuis plusieurs mois pour une grande primaire incluant des personnalités comme Gérald Darmanin et Sarah Knafo."
    fact_b: "Bruno Retailleau a exprimé n'être pas favorable à l'idée d'une primaire."
    claimed_reason: "Plaider pour une grande primaire contredit le fait de ne pas être favorable à l'idée d'une primaire."
    expect: keep
    bucket: position_reversal
    notes: "Advocating FOR a primary vs being against one is a position reversal on the same subject. The auditor wrongly dismissed both as third_party_narrative because they are phrased as reported speech ('plaide'/'a exprimé') — but reported speech of the person's own position counts as his utterance."

  # Abolishing the legal retirement age (no age floor at all) is the OPPOSITE of hardening
  # (raising the age in) Macron's reform — a direction inversion the auditor misreads. (KEEP)
  # PROD FAILURE: the auditor filed the real, hand-verified Bardella contradiction under
  # same_direction ("supprimer l'âge légal = une forme de durcissement") and auto-evicted it
  # twice (cids 226/227 on 2026-07-07, cid 411 on 2026-07-25). Restored as cid 487 on
  # 2026-07-26 (mirror-bii). Party-level sibling shape: TP_114.
  - name: "TP_487_bardella_abolish_age_vs_harden_reform"
    fact_a: "Jordan Bardella a suggéré de supprimer tout âge légal de départ à la retraite."
    fact_b: "Jordan Bardella veut durcir la réforme des retraites de Macron."
    claimed_reason: "La suggestion de supprimer l'âge légal de départ est en opposition directe avec la volonté de durcir la réforme des retraites : supprimer l'âge légal permet de partir plus tôt, durcir la réforme repousse le départ."
    expect: keep
    bucket: position_reversal
    judges: [audit]
    notes: "Direction inversion: no-age-floor (leave earlier/freely) vs harden-the-reform (leave later) are opposing positions on the same axis. The auditor's same_direction bucket must not swallow it. Audit-only: the VERIFIER keeps this only ~2/3 of runs (documented gap, not asserted per the mirror-me2 convention); with the direction clause the auditor keeps it 3/3."

