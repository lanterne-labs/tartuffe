    - label: politique de l'énergie et des prix de l'électricité
      summary: Marine Le Pen critique la gestion gouvernementale des coûts énergétiques, accusant l'État de suivre une idéologie de la décroissance. Elle préconise une baisse des tarifs de l'électricité et dénonce une déconnexion entre les promesses de stabilité tarifaire et l'augmentation réelle des prix prévue pour l'été.
