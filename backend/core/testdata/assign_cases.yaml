      - Marine Le Pen a promis de libérer le pays lors de son lancement de campagne.
      - Le tribunal judiciaire de Paris a accordé à Marine Le Pen le droit d'utiliser le mot 'renaissance' sur son affiche de campagne pour l'élection présidentielle de 2027, rejetant les accusations de contrefaçon et de parasitisme.
