      summary: Marine Le Pen maintient sa position sur un âge de départ à la retraite situé entre 60 et 62 ans, selon l'entrée sur le marché du travail. Elle défend la continuité de son projet de 2022 tout en envisageant une part de capitalisation volontaire pour certains profils. Bien que des divergences aient été évoquées avec Jordan Bardella, elle affirme la cohérence de sa position sur ce sujet.
