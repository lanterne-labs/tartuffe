# Goldens of the grounding check (grounding.go), from the facts of the audit
# of 2026-11-01 (band 153992-161991, text.audit.jsonl). Most source
# documents were no longer stored: the context is the quote with the framing
# the article gave, as the audit notes and the fact texts show it.
#
# expect:
#   grounded: the fact is kept as it is.
#   fix:      rewrite or drop; a rewrite must not keep any phrase of `forbid`
#             unless the (possibly longer) quote now holds it.
#   drop:     the fact is dropped.
#   grounded_or_fix: either; the case only checks nothing is invented.
